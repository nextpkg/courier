version: "2"
formatters:
  enable:
    - gofmt
    - goimports
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/nextpkg/courier)
  exclusions:
    generated: strict
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - testifylint
  settings:
    staticcheck:
      checks: ["SA*", "S*"]
  exclusions:
    generated: strict
    presets: []
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
