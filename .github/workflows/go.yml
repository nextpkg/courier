name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      - name: Build all modules
        run: go build ./... ./transport/memory/... ./transport/nats/... ./transport/kafka/... ./examples/...
      - name: Vet all modules
        run: go vet ./... ./transport/memory/... ./transport/nats/... ./transport/kafka/... ./examples/...
      - name: Test all modules with race detection
        run: go test -race ./... ./transport/memory/... ./transport/nats/... ./transport/kafka/... ./examples/...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      - name: Install golangci-lint v2.15.0
        run: |
          curl -sSfL https://golangci-lint.run/install.sh -o /tmp/install-golangci-lint.sh
          sh /tmp/install-golangci-lint.sh -b "$HOME/.local/bin" v2.15.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint all modules and integration tests
        run: ./scripts/lint.sh
